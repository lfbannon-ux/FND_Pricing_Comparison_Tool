[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnd-pricing-comparison"
version = "1.0.0"
description = "Like-for-like pricing comparison across Floor & Decor, Home Depot and Lowe's"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]

[project.scripts]
fnd-pricing = "fnd_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
